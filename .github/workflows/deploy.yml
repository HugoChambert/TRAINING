name: Deploy to GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Verify Images in Source
        run: |
          echo "🔍 Checking if images exist in public folder..."
          echo "=================================================="
          ls -lh public/assets/img/ || echo "❌ No images found in public/assets/img/"
          echo "=================================================="
      - name: Install dependencies
        run: npm install
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Verify Images in Build Output
        run: |
          echo "🔍 Checking if images were copied to dist folder..."
          echo "=================================================="
          ls -lh dist/assets/img/ || echo
          
